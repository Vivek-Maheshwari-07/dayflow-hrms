<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Employees - HRMS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- <li><a href="profile.html"><i class="ri-user-settings-line"></i> Admin Profile</a></li> -->
    <style>
        /* --- CSS (Same as before) --- */
        :root { --primary-color: #4F46E5; --bg-body: #F3F4F6; --bg-card: #FFFFFF; --bg-sidebar: #FFFFFF; --text-main: #111827; --text-muted: #6B7280; --border-color: #E5E7EB; }
        [data-theme="dark"] { --primary-color: #6366f1; --bg-body: #0F172A; --bg-card: #1E293B; --bg-sidebar: #1E293B; --text-main: #F9FAFB; --text-muted: #9CA3AF; --border-color: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
        .nav-links { list-style: none; } .nav-links li { margin-bottom: 8px; }
        .nav-links a { display: flex; align-items: center; padding: 12px; color: var(--text-muted); border-radius: 8px; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { background-color: var(--primary-color); color: white; }
        .nav-links i { margin-right: 12px; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .top-navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .table-card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { background: var(--bg-body); color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 600; }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .action-btn { background: none; border: none; cursor: pointer; padding: 6px; font-size: 1.1rem; }
        .btn-edit { color: var(--primary-color); }
        .btn-delete { color: #EF4444; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 500; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-body); color: var(--text-main); }
        .close-modal { float: right; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="margin-bottom:40px;"><h2 style="color:var(--primary-color);">HRMS<span style="font-size:0.6em; color:var(--text-muted);">.App</span></h2></div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i class="ri-dashboard-line"></i> Dashboard</a></li>
            <li><a href="all-employees.html" class="active"><i class="ri-user-line"></i> All Employees</a></li>
            <li><a href="leave-requests.html"><i class="ri-calendar-check-line"></i> Leave Requests</a></li>
            <li><a href="attendance.html"><i class="ri-time-line"></i> Attendance</a></li>
            <li><a href="payroll.html"><i class="ri-wallet-3-line"></i> Payroll</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="top-navbar">
            <div class="page-title"><h1>Employee Management</h1></div>
            <div style="display:flex; gap:10px;">
                <button class="btn" onclick="toggleTheme()" style="background:var(--bg-card); border:1px solid var(--border-color)">🌙</button>
                <span>Admin User</span>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-bottom: 20px; gap: 10px;">
            <button class="btn btn-primary" onclick="openAddModal()">+ Add New Employee</button>
            <button class="btn" onclick="clearAllData()" style="color: #EF4444; border: 1px solid #EF4444; background: transparent;">Reset Data</button>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>ID</th><th>Name & Email</th><th>Dept</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal" id="employeeModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="margin-bottom: 20px;">Add Employee</h2>
            <form id="empForm" onsubmit="return false;">
                <input type="hidden" id="editModeId"> <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="empName" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="empEmail" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" id="empID" placeholder="EMP001">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select id="empDept">
                        <option value="Not Assigned">Select Department</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                        <option value="HR">Human Resources</option>
                    </select>
                </div>
                <button type="button" onclick="saveEmployee()" class="btn btn-primary" style="width: 100%;">Save Employee</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('employeeModal');
        const tableBody = document.getElementById('tableBody');
        
        // Load Data
        document.addEventListener('DOMContentLoaded', () => { 
            loadFromLocal(); 
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark'); 
        });

        // --- MODAL FUNCTIONS ---
        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Add New Employee";
            document.getElementById('editModeId').value = ""; // Clear Edit ID
            document.getElementById('empID').disabled = false; // Allow ID edit
            document.getElementById('empForm').reset();
            modal.classList.add('active');
        }

        function openEditModal(id) {
            const employees = JSON.parse(localStorage.getItem('hrms_employees')) || [];
            const emp = employees.find(e => e.id === id);
            
            if(emp) {
                document.getElementById('modalTitle').innerText = "Edit Employee";
                document.getElementById('editModeId').value = emp.id; // Set ID for tracking
                
                // Fill Form
                document.getElementById('empName').value = emp.name;
                document.getElementById('empEmail').value = emp.email;
                document.getElementById('empID').value = emp.id;
                document.getElementById('empID').disabled = true; // Cannot change ID
                document.getElementById('empDept').value = emp.dept;
                
                modal.classList.add('active');
            }
        }

        function closeModal() { modal.classList.remove('active'); }
        window.onclick = (e) => { if(e.target == modal) closeModal(); }

        // --- SAVE FUNCTION (Handles Both Add & Edit) ---
        function saveEmployee() {
            const name = document.getElementById('empName').value;
            const email = document.getElementById('empEmail').value;
            const empId = document.getElementById('empID').value;
            const dept = document.getElementById('empDept').value;
            const editId = document.getElementById('editModeId').value; // Check if editing

            if(!name || !email || !empId) { alert("Please fill all fields"); return; }

            let employees = JSON.parse(localStorage.getItem('hrms_employees')) || [];

            if (editId) {
                // --- EDIT MODE ---
                const index = employees.findIndex(e => e.id === editId);
                if(index !== -1) {
                    employees[index].name = name;
                    employees[index].email = email;
                    employees[index].dept = dept;
                    alert("Employee Updated Successfully!");
                }
            } else {
                // --- ADD MODE ---
                if(employees.some(e => e.id === empId)) { alert("ID already exists!"); return; }
                employees.push({ id: empId, name, email, dept, status: 'Active' });
                alert("New Employee Added!");
            }

            localStorage.setItem('hrms_employees', JSON.stringify(employees));
            loadFromLocal();
            closeModal();
        }

        // --- LOAD & RENDER ---
        function loadFromLocal() {
            tableBody.innerHTML = '';
            let employees = JSON.parse(localStorage.getItem('hrms_employees')) || [];
            employees.forEach(emp => {
                const tr = document.createElement('tr');
                const initial = emp.name.charAt(0).toUpperCase();
                tr.innerHTML = `
                    <td><span style="font-family:monospace; font-weight:600">${emp.id}</span></td>
                    <td>
                        <div style="display:flex; align-items:center; gap:10px">
                            <div style="width:30px; height:30px; border-radius:50%; background:#e0e7ff; color:#4f46e5; display:flex; align-items:center; justify-content:center; font-weight:bold">${initial}</div>
                            <div>
                                <div style="font-weight:600">${emp.name}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted)">${emp.email}</div>
                            </div>
                        </div>
                    </td>
                    <td>${emp.dept}</td>
                    <td><span style="background:rgba(16,185,129,0.15); color:#10B981; padding:4px 10px; border-radius:20px; font-size:0.75rem;">Active</span></td>
                    <td>
                        <button class="action-btn btn-edit" onclick="openEditModal('${emp.id}')"><i class="ri-pencil-line"></i></button>
                        <button class="action-btn btn-delete" onclick="deleteRow('${emp.id}')"><i class="ri-delete-bin-line"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function deleteRow(id) {
            if(confirm("Delete this employee?")) {
                let employees = JSON.parse(localStorage.getItem('hrms_employees')) || [];
                employees = employees.filter(e => e.id !== id);
                localStorage.setItem('hrms_employees', JSON.stringify(employees));
                loadFromLocal();
            }
        }

        function clearAllData() {
            if(confirm("Delete ALL data?")) {
                localStorage.removeItem('hrms_employees');
                loadFromLocal();
            }
        }

        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
    </script>
</body>
</html>
