<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - HRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- <li><a href="profile.html"><i class="ri-user-settings-line"></i> Admin Profile</a></li> -->
    <style>
        :root { --primary-color: #4F46E5; --bg-body: #F3F4F6; --bg-card: #FFFFFF; --bg-sidebar: #FFFFFF; --text-main: #111827; --text-muted: #6B7280; --border-color: #E5E7EB; }
        [data-theme="dark"] { --primary-color: #6366f1; --bg-body: #0F172A; --bg-card: #1E293B; --bg-sidebar: #1E293B; --text-main: #F9FAFB; --text-muted: #9CA3AF; --border-color: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.3s; }
        body { background-color: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
        .sidebar-header h2 { color: var(--primary-color); font-size: 1.5rem; margin-bottom: 40px; }
        .nav-links { list-style: none; }
        .nav-links li { margin-bottom: 8px; }
        .nav-links a { display: flex; align-items: center; padding: 12px; color: var(--text-muted); border-radius: 8px; font-weight: 500; }
        .nav-links a i { margin-right: 12px; font-size: 1.2rem; }
        .nav-links a:hover, .nav-links a.active { background-color: var(--primary-color); color: white; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .top-navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        input[type="date"] { padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main); }
        .table-card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-body); color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 600; }
        .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; font-size: 0.85rem; font-weight: 500; margin-right: 5px; }
        .btn-present { background: rgba(16, 185, 129, 0.1); color: #10B981; border-color: #10B981; }
        .btn-absent { background: rgba(239, 68, 68, 0.1); color: #EF4444; border-color: #EF4444; }
        .btn-late { background: rgba(245, 158, 11, 0.1); color: #F59E0B; border-color: #F59E0B; }
        .btn-active { background-color: currentColor; color: white !important; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header"><h2>HRMS<span style="font-size: 0.6em; color: var(--text-muted);">.App</span></h2></div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i class="ri-dashboard-line"></i> Dashboard</a></li>
            <li><a href="all-employees.html"><i class="ri-user-line"></i> All Employees</a></li>
            <li><a href="leave-requests.html"><i class="ri-calendar-check-line"></i> Leave Requests</a></li>
            <li><a href="attendance.html" class="active"><i class="ri-time-line"></i> Attendance</a></li>
            <li><a href="payroll.html"><i class="ri-wallet-3-line"></i> Payroll</a></li>
        </ul>
    </aside>
    <main class="main-content">
        <div class="top-navbar">
            <div class="page-title"><h1>Attendance Tracker</h1></div>
            <div class="user-profile"><button class="btn" onclick="toggleTheme()" style="background:var(--bg-card); border:1px solid var(--border-color)">🌙</button><span>Admin User</span></div>
        </div>
        <div class="controls-bar">
            <div style="display:flex; align-items:center; gap:10px;"><span style="font-weight:500; color:var(--text-muted);">Select Date:</span><input type="date" id="attendanceDate" onchange="loadAttendance()"></div>
            <div><button class="btn btn-present" onclick="markAll('Present')">Mark All Present</button><button class="btn btn-absent" onclick="markAll('Absent')">Mark All Absent</button></div>
        </div>
        <div class="table-card">
            <table style="width:100%">
                <thead><tr><th>Employee</th><th>ID</th><th>Mark Status</th><th>Current Status</th></tr></thead>
                <tbody id="attendanceBody"></tbody>
            </table>
        </div>
    </main>
    <script>
        const tableBody = document.getElementById('attendanceBody');
        const dateInput = document.getElementById('attendanceDate');
        dateInput.valueAsDate = new Date();
        document.addEventListener('DOMContentLoaded', loadAttendance);
        function loadAttendance() {
            const selectedDate = dateInput.value;
            const employees = JSON.parse(localStorage.getItem('hrms_employees')) || [];
            const attendanceRecord = JSON.parse(localStorage.getItem('hrms_attendance')) || {};
            const todayRecord = attendanceRecord[selectedDate] || {};
            tableBody.innerHTML = '';
            if(employees.length === 0) { tableBody.innerHTML = '<tr><td colspan="4" style="padding:20px; text-align:center;">No employees found. Add employees first!</td></tr>'; return; }
            employees.forEach(emp => {
                const status = todayRecord[emp.id] || 'Not Marked';
                let badgeColor = '#9CA3AF'; let badgeBg = 'rgba(156, 163, 175, 0.1)';
                if(status === 'Present') { badgeColor = '#10B981'; badgeBg = 'rgba(16, 185, 129, 0.1)'; }
                if(status === 'Absent') { badgeColor = '#EF4444'; badgeBg = 'rgba(239, 68, 68, 0.1)'; }
                if(status === 'Late') { badgeColor = '#F59E0B'; badgeBg = 'rgba(245, 158, 11, 0.1)'; }
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><div style="font-weight:600">${emp.name}</div><div style="font-size:0.75rem; color:var(--text-muted)">${emp.dept}</div></td><td style="font-family:monospace">${emp.id}</td><td><button class="btn btn-present ${status==='Present'?'btn-active':''}" onclick="markSingle('${emp.id}', 'Present')">P</button><button class="btn btn-late ${status==='Late'?'btn-active':''}" onclick="markSingle('${emp.id}', 'Late')">L</button><button class="btn btn-absent ${status==='Absent'?'btn-active':''}" onclick="markSingle('${emp.id}', 'Absent')">A</button></td><td><span class="status-badge" style="color:${badgeColor}; background:${badgeBg}">${status}</span></td>`;
                tableBody.appendChild(tr);
            });
            if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
        }
        function markSingle(empId, status) {
            const selectedDate = dateInput.value;
            let attendanceRecord = JSON.parse(localStorage.getItem('hrms_attendance')) || {};
            if (!attendanceRecord[selectedDate]) { attendanceRecord[selectedDate] = {}; }
            attendanceRecord[selectedDate][empId] = status;
            localStorage.setItem('hrms_attendance', JSON.stringify(attendanceRecord));
            loadAttendance();
        }
        function markAll(status) {
            const selectedDate = dateInput.value;
            const employees = JSON.parse(localStorage.getItem('hrms_employees')) || [];
            let attendanceRecord = JSON.parse(localStorage.getItem('hrms_attendance')) || {};
            if (!attendanceRecord[selectedDate]) { attendanceRecord[selectedDate] = {}; }
            employees.forEach(emp => { attendanceRecord[selectedDate][emp.id] = status; });
            localStorage.setItem('hrms_attendance', JSON.stringify(attendanceRecord));
            loadAttendance();
        }
        function toggleTheme() { const body = document.body; const isDark = body.getAttribute('data-theme') === 'dark'; body.setAttribute('data-theme', isDark ? 'light' : 'dark'); localStorage.setItem('theme', isDark ? 'light' : 'dark'); }
    </script>
</body>
</html>
