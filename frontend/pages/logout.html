<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - HRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #F3F4F6; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            flex-direction: column;
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            animation: fadeIn 0.5s ease-in-out;
        }
        .icon-box {
            width: 70px;
            height: 70px;
            background: #DEF7EC; /* Green Light */
            color: #03543F;       /* Green Dark */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 2rem;
        }
        h2 { color: #111827; margin-bottom: 10px; }
        p { color: #6B7280; margin-bottom: 30px; font-size: 0.95rem; line-height: 1.5; }
        
        .btn { 
            display: inline-block;
            width: 100%; 
            padding: 12px; 
            background: #4F46E5; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            text-decoration: none;
            transition: background 0.3s;
            cursor: pointer;
        }
        .btn:hover { background: #4338ca; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">
            <i class="ri-check-line"></i>
        </div>
        <h2>Signed Out</h2>
        <p>You have been successfully logged out of the system. You can now close this window or sign in again.</p>
        
        <a href="login.html" class="btn">Sign In Again</a>
    </div>

    <script>
        // PAGE LOAD HOTE HI SESSION CLEAR KARO
        document.addEventListener('DOMContentLoaded', () => {
            // Sirf 'currentUser' udao, taaki data (Employees/Leaves) delete na ho
            // Agar tumhe sab kuch udana hai (Testing ke liye) to localStorage.clear() use karo
            localStorage.removeItem('currentUser'); 
            
            console.log("Session Cleared. User Logged Out.");
        });
    </script>

</body>
</html>
