<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HRMS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        /* --- THEME CONFIG --- */
        :root {
            --primary: #4F46E5; --primary-hover: #4338ca;
            --bg-body: #F8FAFC; --bg-card: #FFFFFF;
            --text-main: #0F172A; --text-muted: #64748B;
            --border: #E2E8F0; --input-bg: #F1F5F9;
        }
        [data-theme="dark"] {
            --primary: #818CF8; --primary-hover: #6366f1;
            --bg-body: #0F172A; --bg-card: #1E293B;
            --text-main: #F8FAFC; --text-muted: #94A3B8;
            --border: #334155; --input-bg: #020617;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        body { background: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }

        /* Animated Background Blob */
        .blob {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.3) 0%, transparent 70%);
            border-radius: 50%; filter: blur(80px); z-index: -1;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-20px, 20px); } }

        /* Card Style */
        .card {
            background: var(--bg-card); width: 100%; max-width: 420px;
            padding: 40px; border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; }
        p { color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }

        /* Inputs */
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        input {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--input-bg);
            color: var(--text-main); outline: none; font-size: 1rem;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); background: var(--bg-card); }

        /* Button */
        .btn-login {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: var(--primary); color: white; font-weight: 600;
            font-size: 1rem; cursor: pointer; margin-top: 10px;
        }
        .btn-login:hover { background: var(--primary-hover); transform: translateY(-2px); }

        /* Links */
        .footer-link { margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }

        /* Top Bar Controls */
        .top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .icon-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
        .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>

    <div class="top-controls">
        <a href="../../index.html" class="icon-btn" title="Home"><i class="ri-home-4-line"></i></a>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme"><i class="ri-moon-line"></i></button>
    </div>

    <div class="blob"></div>

    <div class="card">
        <div style="font-size: 2.5rem; color: var(--primary); margin-bottom: 10px;"><i class="ri-user-smile-fill"></i></div>
        <h2>Welcome Back</h2>
        <p>Please enter your details to sign in.</p>

        <form onsubmit="login(event)">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <div class="footer-link">
            Don't have an account? <a href="signup.html">Create Account</a>
        </div>
    </div>

    <script>
        // Theme Logic
        if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Login Logic
        async function login(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.innerText = "Authenticating...";
            btn.style.opacity = "0.7";

            try {
                const res = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('currentUser', JSON.stringify({
                        name: data.username, id: data.employeeId, role: data.role
                    }));
                    
                    // Redirect based on role
                    if(data.role === 'Admin') window.location.href = "admin/dashboard.html";
                    else window.location.href = "employee/dashboard.html";
                } else {
                    alert(data.message);
                    btn.innerText = "Sign In";
                    btn.style.opacity = "1";
                }
            } catch (err) { 
                alert("Server Error. Is Backend Running?"); 
                btn.innerText = "Sign In";
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
