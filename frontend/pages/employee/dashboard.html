<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - HRMS</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4F46E5;
            --bg-body: #F3F4F6;
            --bg-card: #FFFFFF;
            --bg-sidebar: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }
        [data-theme="dark"] {
            --primary-color: #6366f1;
            --bg-body: #0F172A;
            --bg-card: #1E293B;
            --bg-sidebar: #1E293B;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border-color: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
        a { text-decoration: none; color: inherit; }

        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
        .sidebar-header h2 { color: var(--primary-color); font-size: 1.5rem; margin-bottom: 40px; }
        .nav-links { list-style: none; }
        .nav-links li { margin-bottom: 8px; }
        .nav-links a { display: flex; align-items: center; padding: 12px; color: var(--text-muted); border-radius: 8px; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { background-color: var(--primary-color); color: white; }
        .nav-links i { margin-right: 12px; font-size: 1.2rem; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .top-navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn { padding: 8px 15px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); cursor: pointer; color: var(--text-main); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        .icon { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 15px; }
        .card h3 { margin-bottom: 5px; color: var(--text-main); }
        .card p { color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>HRMS<span style="font-size: 0.6em; color: var(--text-muted);">.Emp</span></h2>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="active"><i class="ri-dashboard-line"></i> Dashboard</a></li>
            <li><a href="profile.html"><i class="ri-user-settings-line"></i> My Profile</a></li>
            <li><a href="attendance.html"><i class="ri-time-line"></i> Attendance</a></li>
            <li><a href="leave.html"><i class="ri-calendar-check-line"></i> Leave Request</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="top-navbar">
            <div class="page-title">
                <h1>Welcome, <span id="userName">User</span></h1>
                <p style="color: var(--text-muted);">Have a productive day!</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="toggleTheme()"><i class="ri-moon-line"></i></button>
                <button class="btn" onclick="logout()" style="background: #EF4444; color: white; border: none;">Logout</button>
            </div>
        </div>

        <div class="grid">
            <div class="card" onclick="location.href='attendance.html'">
                <div class="icon"><i class="ri-checkbox-circle-line"></i></div>
                <h3>Check Attendance</h3>
                <p>View your monthly records</p>
            </div>
            <div class="card" onclick="location.href='leave.html'">
                <div class="icon"><i class="ri-plane-line"></i></div>
                <h3>Apply Leave</h3>
                <p>Sick, Casual & Paid Leaves</p>
            </div>
            <div class="card" onclick="location.href='profile.html'">
                <div class="icon"><i class="ri-user-line"></i></div>
                <h3>My Profile</h3>
                <p>View and edit your details</p>
            </div>
        </div>
    </main>

    <script>
        // Auth Check
        const user = JSON.parse(localStorage.getItem('currentUser'));

        if(!user || user.role !== 'Employee') {
            window.location.href = '../login.html';
        } else {
            document.getElementById('userName').innerText = user.name;
        }

        // Theme Logic
        if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        function toggleTheme() {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        function logout() {
            if(confirm("Logout from Employee Dashboard?")) {
                localStorage.removeItem('currentUser');
                window.location.href = '../login.html';
            }
        }
    </script>
</body>
</html>
